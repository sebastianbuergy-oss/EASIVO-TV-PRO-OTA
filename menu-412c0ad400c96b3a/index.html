<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b0f0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bürgy TV · Menü-Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #0b0f0c; --surface: #141b16; --raised: #1c251f; --text: #eef1ea; --muted: #939f96;
    --line: rgba(238,241,234,.10); --green: #5cff00; --on: #071007;
    --sans: 'Bricolage Grotesque', -apple-system, 'Segoe UI', Helvetica, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { min-height: 100dvh; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .app { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .brand { display: flex; align-items: baseline; gap: 7px; }
  .brand b { font: 800 25px/1 var(--sans); letter-spacing: -.03em; }
  .brand i { font: 700 25px/1 var(--mono); font-style: normal; color: var(--green); }
  .brand small { font: 700 9px/1 var(--mono); letter-spacing: .2em; color: var(--muted); }
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; }
  .icons { display: flex; gap: 8px; }
  .seg { display: flex; padding: 4px; margin-top: 12px; border-radius: 28px; background: var(--surface); }
  .seg button { flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 7px; font: 800 16px/1 var(--sans); color: var(--text); }
  .seg button.on { background: var(--green); color: var(--on); }
  .label { font: 700 12px/1 var(--mono); letter-spacing: .14em; color: var(--green); margin: 20px 0 10px; display: flex; justify-content: space-between; }
  .label span { color: var(--muted); letter-spacing: 0; }
  .strip { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .cont { width: 170px; flex-shrink: 0; text-align: left; }
  .thumb { position: relative; height: 96px; border-radius: 12px; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.18); }
  .bar div { height: 100%; background: var(--green); }
  .play { position: absolute; right: 8px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
  .cont .t { font: 700 14px/1.15 var(--sans); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cont .r { font: 500 11px/1.3 var(--mono); color: var(--green); }
  .quick { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-radius: 14px; background: var(--surface); margin-bottom: 6px; text-align: left; }
  .quick .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--raised); display: grid; place-items: center; }
  .quick .n, .row .n { font: 700 14px/1 var(--mono); color: var(--muted); }
  .quick .name { flex: 1; font: 800 17px/1.15 var(--sans); }
  .row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 4px 8px 14px; border-bottom: 1px solid var(--line); text-align: left; }
  .row .name { flex: 1; font: 700 17px/1.2 var(--sans); }
  .tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .qtile { min-height: 88px; border-radius: 16px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
  .qtile b { font: 800 15px/1.1 var(--sans); display: block; }
  .qtile small { font: 700 11px/1.4 var(--mono); color: var(--muted); }
  .tiles2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ctile { position: relative; min-height: 96px; border-radius: 16px; overflow: hidden; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; text-align: left; }
  .ctile b { position: relative; font: 800 17px/1.1 var(--sans); }
  .ctile small { position: relative; font: 700 12px/1.4 var(--mono); color: var(--green); }
  .split { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 12px; margin-top: 16px; }
  .rail { display: flex; flex-direction: column; gap: 2px; }
  .rail button { text-align: left; padding: 10px; border-radius: 12px; border-bottom: 1px solid var(--line); min-height: 52px; }
  .rail button b { display: block; font: 800 14px/1.15 var(--sans); }
  .rail button small { font: 700 11px/1.4 var(--mono); color: var(--muted); }
  .rail button.on { background: var(--green); color: var(--on); border-color: transparent; }
  .rail button.on small { color: var(--on); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .poster { position: relative; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; text-align: left; width: 100%; }
  .poster .rate { position: absolute; left: 6px; top: 6px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(7,16,7,.85); font: 700 11px/20px var(--mono); color: var(--green); }
  .poster .pt { position: absolute; left: 8px; right: 8px; bottom: 8px; font: 800 14px/1.05 var(--sans); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.85); }
  .h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 10px; }
  .h2 b { font: 800 20px/1.1 var(--sans); }
  .h2 span { font: 700 11px/1 var(--mono); color: var(--muted); }
  .ch { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 72px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
  .ch .num { width: 24px; font: 700 12px/1 var(--mono); color: var(--muted); }
  .logo { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font: 800 15px/1 var(--sans); flex-shrink: 0; }
  .ch .mid { flex: 1; min-width: 0; }
  .ch .cn { display: flex; justify-content: space-between; gap: 6px; font: 700 16px/1.15 var(--sans); }
  .ch .cn span { font: 500 11px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
  .ch .show { font: 500 14px/1.3 var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar { height: 3px; border-radius: 2px; background: var(--raised); margin-top: 5px; }
  .pbar div { height: 100%; border-radius: 2px; background: var(--green); }
  .now { position: relative; display: block; width: 100%; height: 190px; border-radius: 20px; overflow: hidden; margin-top: 16px; text-align: left; }
  .live { position: absolute; left: 14px; top: 14px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--green); color: var(--on); font: 800 12px/26px var(--sans); letter-spacing: .08em; }
  .nowinfo { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .nowinfo small { font: 500 12px/1 var(--mono); color: var(--muted); }
  .nowinfo b { display: block; font: 800 23px/1.05 var(--sans); margin: 4px 0; }
  .bigplay { width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex-shrink: 0; }
  .screen { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 5; animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
  .back { display: flex; align-items: center; gap: 4px; min-height: 44px; color: var(--green); font: 700 17px/1 var(--sans); }
  .title { font: 800 30px/1.05 var(--sans); margin: 8px 0 14px; }
  .search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: var(--surface); color: var(--muted); font: 500 16px/1 var(--sans); margin-bottom: 12px; }
  .hero { position: relative; height: 230px; border-radius: 18px; overflow: hidden; margin-top: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px; border-radius: 27px; background: var(--green); color: var(--on); font: 800 18px/1 var(--sans); }
  .btn2 { display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: var(--raised); }
  .meta { font: 600 14px/1.4 var(--mono); color: var(--muted); margin: 6px 0 14px; }
  .switch { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%); z-index: 10; display: flex; gap: 4px; padding: 4px; border-radius: 26px; background: rgba(20,27,22,.92); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .switch span { font: 700 11px/44px var(--mono); color: var(--muted); padding: 0 8px 0 10px; }
  .switch button { min-width: 44px; height: 44px; border-radius: 22px; font: 800 15px/1 var(--sans); color: var(--text); padding: 0 12px; }
  .switch button.on { background: var(--green); color: var(--on); }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 76px); transform: translateX(-50%); z-index: 20; background: var(--text); color: var(--bg); font: 700 14px/1.3 var(--sans); padding: 10px 16px; border-radius: 14px; max-width: 86vw; text-align: center; }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="switch" id="switch"></div>
<script>
(function () {
  const G = '#5cff00', ON = '#071007', MUTED = '#939f96', TEXT = '#eef1ea';
  const svg = {
    tv: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/>',
    series: '<rect x="3" y="7" width="15" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/><path d="m9.5 11 4.5 2.5L9.5 16z"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    star: '<path d="m12 3.8 2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.8l-5.1 2.6 1-5.6-4.1-4 5.7-.8z"/>',
    flame: '<path d="M12 21c-3.9 0-7-2.8-7-6.6 0-3.1 2.1-5.3 3.6-7 .5 1.9 1.6 3 2.7 3.4-.3-3 1-5.8 3.3-7.8.3 2.8 1.6 4.6 3 6.3 1 1.3 1.4 2.8 1.4 4.3C19 18.2 15.9 21 12 21z"/>',
    eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    chev: '<path d="m9 6 6 6-6 6"/>',
    back: '<path d="m15 6-6 6 6 6"/>',
  };
  const ic = (n, s = 20, c = 'currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svg[n]}</svg>`;
  const playIc = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a.8.8 0 0 0 1.2.7l12-7.5a.8.8 0 0 0 0-1.4l-12-7.5A.8.8 0 0 0 7 4.5z" fill="${c}"/></svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // Fictional catalogue: no real titles, channels or artwork.
  const PALS = [['#27485a', '#0d1a22', '#e7a95a'], ['#8a3b1c', '#2a1410', '#f2b25c'], ['#123a3a', '#07131a', '#7ee0c3'], ['#3b3350', '#14111d', '#e88a6b'],
    ['#351a44', '#0d0914', '#ff6fae'], ['#1f4c66', '#0b1d28', '#9fd8ff'], ['#2d5146', '#0c1714', '#f0cf7a'], ['#1d2a44', '#0a0f19', '#6fb2ff'], ['#2a1f4a', '#0b0818', '#b8a6ff'], ['#4a2a1a', '#150c08', '#ffb870']];
  const art = (i) => { const [a, b, c] = PALS[i % PALS.length]; const k = i % 4;
    const motif = k === 0 ? `radial-gradient(circle at 50% 38%, ${c} 0 22%, transparent 36%)` : k === 1 ? `radial-gradient(120% 60% at 70% 10%, ${c} 0, transparent 60%)`
      : k === 2 ? `repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.07) 18px 36px), radial-gradient(70% 50% at 30% 30%, ${c}, transparent 70%)` : `radial-gradient(90% 50% at 50% 100%, ${c} 0, transparent 70%)`;
    return `background: ${motif}, linear-gradient(165deg, ${a}, ${b});`; };
  const TITLES = ['Die letzte Expedition', 'Wege des Westens', 'Nordlicht', 'Stille Stadt', 'Neon Nights', 'Salz und Meer', 'Der lange Winter', 'Grenzland', 'Roter Himmel', 'Kaltes Wasser',
    'Die Insel', 'Morgenrot', 'Letzter Zug', 'Glashaus', 'Funkstille', 'Weiße Nächte', 'Sturmwarnung', 'Unter Null', 'Das Versprechen', 'Fernweh'];
  const SERIES = ['Horizonte', 'Code Zero', 'Sternenjäger', 'Schatten der Vergangenheit', 'Bergwacht', 'Die Kanzlei', 'Nachtschicht', 'Hafenviertel', 'Zeitreisende', 'Familienbande'];
  const CATS = {
    movie: ['Abenteuer', 'Action', 'Drama', 'Dokumentation', 'Kinder', 'Komödie', 'Krimi', 'Thriller', 'Science-Fiction', 'Horror', 'Romantik', 'Western', 'Neue Filme 2026', 'Filme 4K'],
    series: ['Drama-Serien', 'Krimi-Serien', 'Comedy', 'Doku-Serien', 'Kinder-Serien', 'Sci-Fi-Serien', 'Neue Staffeln'],
    live: ['Schweiz', 'Deutschland', 'Österreich', 'Sport', 'Nachrichten', 'Dokumentationen', 'Kinder', 'Musik', 'International'],
  };
  const CHANNELS = ['Alpen TV', 'Schweiz Aktuell', 'Stadt TV', 'Sport Arena', 'Sport Arena 2', 'World News', 'Natur Welt', 'Doku Plus', 'Kinderzeit', 'Music One', 'Kultur Eins', 'Cinema Plus', 'Berg Kanal', 'Nachtfilm', 'Global 24'];
  const SHOWS = ['Finale live', 'Abendnachrichten', 'Wildnis der Alpen', 'Regional am Abend', 'Konzert im Park', 'Die kleine Bärenbande', 'Reportage', 'Spielfilm', 'Wetter kompakt', 'Talk am Abend'];
  const count = (name) => { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return 24 + h % 380; };
  const items = (kind, cat) => { const base = kind === 'series' ? SERIES : TITLES; const seed = count(cat);
    return Array.from({ length: 18 }, (_, i) => ({ title: base[(seed + i * 7) % base.length], art: seed + i, rating: (6 + ((seed + i * 13) % 30) / 10).toFixed(1) })); };
  const channels = (cat) => { const seed = count(cat);
    return Array.from({ length: 12 }, (_, i) => { const start = 20 + ((seed + i) % 2) * 0; const m = (seed + i * 11) % 50;
      return { name: CHANNELS[(seed + i * 5) % CHANNELS.length], show: SHOWS[(seed + i * 3) % SHOWS.length], time: `20:${String(m % 30).padStart(2, '0')}–21:${String((m + 15) % 60).padStart(2, '0')}`, p: 0.2 + ((seed + i * 17) % 70) / 100, art: seed + i }; }); };
  const QUICK = { live: [['star', 'Favoriten', 14], ['eye', 'Zuletzt gesehen', 6]], movie: [['star', 'Favoriten', 18], ['flame', 'Neu hinzugefügt', 100], ['eye', 'Zuletzt gesehen', 7]], series: [['star', 'Favoriten', 9], ['flame', 'Neu hinzugefügt', 100], ['eye', 'Zuletzt gesehen', 4]] };
  const TOTAL = { live: '412 Sender', movie: '2 140 Filme', series: '412 Serien' };

  let variant = 1; try { variant = +localStorage.getItem('btv-menu') || 1; } catch (e) {}
  const requested = +new URLSearchParams(location.search).get('menu'); if ([1, 2, 3].includes(requested)) variant = requested;
  const requestedMode = new URLSearchParams(location.search).get('mode');
  const state = { mode: ['live', 'movie', 'series'].includes(requestedMode) ? requestedMode : 'movie', variant, split: 'Neu hinzugefügt', stack: [] };

  const toast = (msg) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); };
  const top = () => `<div class="top"><div class="brand" aria-label="Bürgy TV Premium"><b>BÜRGY</b><i>TV</i><small>PREMIUM</small></div>
    <div class="icons"><button class="round" data-a="search" aria-label="Suche">${ic('search', 20, TEXT)}</button><button class="round" data-a="gear" aria-label="Einstellungen">${ic('gear', 20, TEXT)}</button></div></div>`;
  const seg = () => `<div class="seg">${[['live', 'tv', 'Live-TV'], ['movie', 'film', 'Filme'], ['series', 'series', 'Serien']].map(([m, i, l]) =>
    `<button class="${state.mode === m ? 'on' : ''}" data-mode="${m}">${ic(i, 18, state.mode === m ? ON : MUTED)}${l}</button>`).join('')}</div>`;
  const cont = () => { if (state.mode === 'live') return nowCard();
    const list = state.mode === 'series' ? [[SERIES[0], 3, .47, 'S1·F3 · noch 24 Min.'], [SERIES[2], 8, .2, 'S2·F1 · noch 40 Min.']] : [[TITLES[1], 1, .4, 'noch 71 Min.'], [TITLES[3], 3, .7, 'noch 38 Min.'], [TITLES[5], 5, .9, 'noch 12 Min.']];
    return `<div class="label">WEITERSCHAUEN</div><div class="strip">${list.map(([t, a, p, r]) => `<button class="cont" data-a="play" data-t="${esc(t)}"><div class="thumb" style="${art(a)}"><div class="play">${playIc(14, ON)}</div><div class="bar"><div style="width:${p * 100}%"></div></div></div><div class="t">${esc(t)}</div><div class="r">${r}</div></button>`).join('')}</div>`; };
  const nowCard = () => `<button class="now" data-a="play" data-t="Sport Arena" style="${art(7)}"><div class="live">● LIVE</div><div class="nowinfo"><div><small>ZULETZT · Sport Arena</small><b>Finale live</b><small>Danach 22:30 · Spätausgabe</small></div><div class="bigplay">${playIc(20, ON)}</div></div></button>`;
  const quickRows = () => QUICK[state.mode].map(([i, l, n], idx) => `<button class="quick" data-cat="${esc(l)}"><span class="ic">${ic(i, 20, G)}</span><span class="name">${l}</span><span class="n">${n}</span>${ic('chev', 18, MUTED)}</button>`).join('');
  const catRows = () => CATS[state.mode].map(c => `<button class="row" data-cat="${esc(c)}"><span class="name">${esc(c)}</span><span class="n">${count(c)}</span>${ic('chev', 18, MUTED)}</button>`).join('');
  const posters = (list, cls) => `<div class="${cls}">${list.map(it => `<button class="poster" data-a="detail" data-t="${esc(it.title)}" data-art="${it.art}" data-r="${it.rating}" style="${art(it.art)}"><span class="rate">★ ${it.rating}</span><span class="pt">${esc(it.title)}</span></button>`).join('')}</div>`;
  const chanList = (cat) => channels(cat).map((c, i) => `<button class="ch" data-a="play" data-t="${esc(c.name)}"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="logo" style="${art(c.art)} color:${G}">${esc(c.name.split(' ').map(w => w[0]).join('').slice(0, 2))}</span><span class="mid"><span class="cn">${esc(c.name)}<span>${c.time}</span></span><span class="show">${esc(c.show)}</span><span class="pbar"><div style="width:${c.p * 100}%"></div></span></span></button>`).join('');

  function body() {
    const v = state.variant, m = state.mode;
    if (v === 1) return cont() + `<div class="label">KATEGORIEN <span>${TOTAL[m]}</span></div>` + quickRows() + catRows();
    if (v === 3) {
      const q = QUICK[m].map(([i, l, n]) => `<button class="qtile" data-cat="${esc(l)}">${ic(i, 22, G)}<span><b>${l.replace(' hinzugefügt', '').replace(' gesehen', '')}</b><small>${n}</small></span></button>`).join('');
      const t = CATS[m].map((c, idx) => `<button class="ctile" data-cat="${esc(c)}" style="${art(idx + 2)}"><b>${esc(c)}</b><small>${count(c)} ${m === 'live' ? 'Sender' : 'Titel'}</small></button>`).join('');
      return cont() + `<div class="label" style="margin-top:14px"></div><div class="tiles3" style="${QUICK[m].length === 2 ? 'grid-template-columns:repeat(2,minmax(0,1fr))' : ''}">${q}</div><div class="label">KATEGORIEN <span>${TOTAL[m]}</span></div><div class="tiles2">${t}</div>`;
    }
    const railNames = QUICK[m].map(([, l, n]) => [l, n]).concat(CATS[m].map(c => [c, count(c)]));
    if (!railNames.some(([l]) => l === state.split)) state.split = railNames[0][0];
    const rail = railNames.map(([l, n]) => `<button class="${l === state.split ? 'on' : ''}" data-split="${esc(l)}"><b>${esc(l.replace(' hinzugefügt', '').replace(' gesehen', ''))}</b><small>${n}</small></button>`).join('');
    const right = m === 'live' ? chanList(state.split) : posters(items(m, state.split), 'grid2');
    return (m === 'live' ? nowCard() : '') + `<div class="split"><div class="rail">${rail}</div><div><div class="h2"><b>${esc(state.split)}</b><span>${m === 'live' ? '12 Sender' : count(state.split)}</span></div>${right}</div></div>`;
  }

  function screen(s) {
    if (s.type === 'cat') {
      const m = state.mode;
      return `<div class="app"><button class="back" data-a="back">${ic('back', 22, G)}Zurück</button><div class="title">${esc(s.cat)}</div>
        <div class="search">${ic('search', 18, G)}${m === 'live' ? 'Sender suchen' : m === 'series' ? 'Serien durchsuchen' : 'Filme durchsuchen'}</div>
        ${m === 'live' ? chanList(s.cat) : posters(items(m, s.cat), 'grid3')}</div>`;
    }
    return `<div class="app"><button class="back" data-a="back">${ic('back', 22, G)}Zurück</button><div class="hero" style="${art(+s.art)}"></div>
      <div class="title" style="margin-top:16px">${esc(s.t)}</div><div class="meta">2026 · ★ ${esc(s.r)} · 1 Std. 52 Min.</div>
      <div style="display:flex;gap:12px;align-items:center"><button class="btn" data-a="play" data-t="${esc(s.t)}">${playIc(18, ON)}Abspielen</button><button class="btn2" data-a="fav" aria-label="Favorit">${ic('star', 22, G)}</button></div>
      <p style="color:${MUTED};font:500 16px/1.5 var(--sans);margin-top:18px">Eine erfundene Beschreibung, damit die Seite echt wirkt. In der App steht hier der Text deines Anbieters.</p></div>`;
  }

  function render() {
    document.getElementById('app').innerHTML = top() + seg() + body();
    document.querySelectorAll('.screen').forEach(el => el.remove());
    state.stack.forEach(s => { const el = document.createElement('div'); el.className = 'screen'; el.innerHTML = screen(s); document.body.insertBefore(el, document.getElementById('switch')); });
    document.getElementById('switch').innerHTML = `<span>MENÜ</span>${[1, 2, 3].map(n => `<button class="${state.variant === n ? 'on' : ''}" data-variant="${n}" aria-label="Menü ${n}">${n}</button>`).join('')}`;
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mode) { state.mode = b.dataset.mode; state.stack = []; render(); window.scrollTo(0, 0); return; }
    if (b.dataset.variant) { state.variant = +b.dataset.variant; state.stack = []; try { localStorage.setItem('btv-menu', state.variant); } catch (err) {} render(); window.scrollTo(0, 0); return; }
    if (b.dataset.split) { state.split = b.dataset.split; render(); return; }
    if (b.dataset.cat) { state.stack.push({ type: 'cat', cat: b.dataset.cat }); render(); return; }
    const a = b.dataset.a;
    if (a === 'back') { state.stack.pop(); render(); return; }
    if (a === 'detail') { state.stack.push({ type: 'detail', t: b.dataset.t, art: b.dataset.art, r: b.dataset.r }); render(); return; }
    if (a === 'play') { toast(`„${b.dataset.t}“ würde jetzt abspielen (nur Vorschau)`); return; }
    if (a === 'fav') { toast('Zu Favoriten hinzugefügt (Vorschau)'); return; }
    if (a === 'search') { toast('Suche kommt in der App'); return; }
    if (a === 'gear') { toast('Einstellungen kommen in der App'); return; }
  });
  render();
})();
</script>
</body>
</html>
